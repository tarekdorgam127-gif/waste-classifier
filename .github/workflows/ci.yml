name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install torch torchvision
          pip install pytest pytest-cov
          pip install fastapi uvicorn onnxruntime pillow numpy structlog python-multipart pydantic
          pip install scikit-learn httpx2
      - name: Run tests
        run: |
          pytest -q

